; PlatformIO project for the paddlesense ESP32 data logger.
; Board: ESP32-WROOM-32 (FCC ID 2A53N-ESP32) — supports Bluetooth Classic SPP.
;
; Build:  pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The ESP32 Arduino core ships BluetoothSerial, SD, Wire, Preferences and
; esp32-hal-crc (hardware CRC32) — no external libraries are required.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -std=gnu++17

build_unflags =
    -std=gnu++11
